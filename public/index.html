<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello Score</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #111827;
    color: #f9fafb;
    gap: 24px;
  }
  h1 {
    font-size: 3rem;
    margin: 0;
  }
  button {
    font-size: 1.5rem;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <h1>Score: <span id="score">0</span></h1>
  <button id="helloBtn">Hello</button>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('helloBtn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
